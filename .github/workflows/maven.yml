name: Java CI with Maven

on:
  push:


jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1
    - name: Set up JDK
      uses: actions/setup-java@v6.0.1
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file backend/pom.xml
